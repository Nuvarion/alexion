# Деплой на GitHub Pages: сборка на каждый пуш в main.
# Ключи Supabase вшиваются в бандл на этапе сборки из секретов репозитория.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      # Без ключей Supabase бандл соберётся, но сайт упадёт белым экраном —
      # лучше уронить сборку сразу с понятной ошибкой
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Секреты VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY не заданы (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - run: yarn build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # SPA-fallback: GitHub Pages отдаёт 404.html для несуществующих путей
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
