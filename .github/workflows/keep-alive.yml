# Не даёт Supabase free-tier проекту заснуть: пауза наступает после 7 дней
# без запросов к БД, пингуем дважды в неделю.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1,4' # Пн и Чт, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/pages?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            > /dev/null
          echo "Supabase is awake"
